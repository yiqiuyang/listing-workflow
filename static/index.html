<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Listing 一键生成</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --border: #e3e8ee;
    --text: #1f2733; --muted: #6b7686; --primary: #ff9900; --primary-dark: #e88b00;
    --ok: #16a34a; --err: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; }
  h1 span { color: var(--primary); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(16,24,40,.04); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  label .req { color: var(--err); margin-left: 2px; }
  input[type=text], input[type=password], select, textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(255,153,0,.35); border-color: var(--primary); }
  textarea { resize: vertical; min-height: 110px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  /* 设置区 */
  #settings { display: none; }
  #settings.open { display: block; }
  .gear { background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 38px; height: 38px; font-size: 18px; cursor: pointer; }
  .gear:hover { border-color: var(--primary); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: var(--primary); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; padding: 12px 32px; font-size: 15px; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
  /* 上传区 */
  .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 26px 16px; text-align: center; color: var(--muted); cursor: pointer; transition: .15s; }
  .drop.hover { border-color: var(--primary); background: rgba(255,153,0,.05); color: var(--primary); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .thumb { position: relative; width: 84px; height: 84px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .rm { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; border: none; font-size: 12px; line-height: 1; cursor: pointer; }
  /* 生成结果 */
  #resultCard { display: none; }
  .stream { background: #fafbfc; border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow-y: auto; font-family: Consolas, monospace; }
  .sec { border: 1px solid var(--border); border-radius: 10px; margin-top: 14px; overflow: hidden; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; background: #fafbfc; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .sec-title { font-weight: 600; font-size: 13px; }
  .sec-meta { font-size: 12px; color: var(--muted); margin-right: auto; margin-left: 10px; }
  .sec-body { padding: 12px 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.65; }
  .sec-zh { display: none; padding: 10px 14px 12px; margin: 0 14px 12px; border: 1px dashed #b8c4d6; border-radius: 8px; background: #f6f8fb; color: #5a6b7f; font-size: 13px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .ok { color: var(--ok); } .err { color: var(--err); }
  /* toast */
  #toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1f2733; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Amazon Listing <span>一键生成</span></h1>
      <div class="sub">商品图片 + 竞品五点 → 标题 / 五点描述 / 产品描述 / Search Terms</div>
    </div>
    <button class="gear" id="gearBtn" title="API 设置">⚙</button>
  </header>

  <div class="card" id="settings">
    <label>Base URL</label>
    <input type="text" id="baseUrl" placeholder="例如 https://api.example.com/v1">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <label>模型名称（需支持图片输入）</label>
    <input type="text" id="model" list="modelList" placeholder="例如 glm-4.5v / qwen-vl-max / gpt-4o">
    <label>DeepL API Key（可选，用于中文对照翻译）</label>
    <input type="password" id="deeplKey" placeholder="免费版 key 以 :fx 结尾；留空则不翻译">
    <datalist id="modelList"></datalist>
    <div class="hint">三种均必填，保存在本地 data/config.json</div>
    <div style="margin-top:14px; display:flex; gap:10px;">
      <button class="btn btn-sm" id="fetchModelsBtn">获取模型列表</button>
      <button class="btn btn-sm" id="testBtn">测试连接</button>
      <button class="btn btn-sm btn-primary" style="margin-left:auto" id="saveCfgBtn">保存设置</button>
    </div>
  </div>

  <div class="card">
    <label>商品图片 <span class="req">*</span></label>
    <div class="drop" id="drop">点击或拖拽图片到此处（最多 8 张，每张 ≤10MB）</div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    <div class="thumbs" id="thumbs"></div>

    <label>竞品五点描述 <span class="req">*</span></label>
    <textarea id="competitor" placeholder="粘贴 1~3 个同类竞品的五点描述（bullet points），用于参考卖点方向与关键词，生成时不会照抄"></textarea>

    <div class="row">
      <div>
        <label>目标站点</label>
        <select id="marketplace"></select>
      </div>
      <div>
        <label>产品名称（可选）</label>
        <input type="text" id="productName" placeholder="用于标题品牌位/系列名，可留空">
      </div>
    </div>

    <label>补充说明（可选）</label>
    <textarea id="notes" style="min-height:70px" placeholder="中文卖点、材质尺寸参数、包装清单等，支持中文"></textarea>

    <div style="margin-top:18px; display:flex; align-items:center; gap:14px;">
      <button class="btn btn-primary" id="genBtn">一键生成 Listing</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="card" id="resultCard">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
      <div class="sec-title">生成结果</div>
      <button class="btn btn-sm" id="copyAllBtn">复制全部</button>
    </div>
    <div class="stream" id="stream" style="display:none"></div>
    <div id="sections"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const toastBox = $('toast');
let toastTimer;
function toast(msg, ok = true) {
  toastBox.textContent = msg;
  toastBox.style.background = ok ? '#1f2733' : '#dc2626';
  toastBox.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastBox.classList.remove('show'), 2200);
}

/* ---------- 配置 ---------- */
async function loadConfig() {
  const res = await fetch('/api/config');
  const cfg = await res.json();
  $('baseUrl').value = cfg.base_url || '';
  $('model').value = cfg.model || '';
  $('apiKey').value = '';
  $('apiKey').placeholder = cfg.has_api_key ? `已保存 ${cfg.api_key_masked}（留空则不修改）` : 'sk-...';
  $('deeplKey').value = '';
  $('deeplKey').placeholder = cfg.has_deepl_key ? `已保存 ${cfg.deepl_api_key_masked}（留空则不修改）` : '免费版 key 以 :fx 结尾；留空则不翻译';
  const sel = $('marketplace');
  cfg.marketplaces.forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = m; if (m === 'US') o.selected = true;
    sel.appendChild(o);
  });
  if (!cfg.base_url || !cfg.model || !cfg.has_api_key) $('settings').classList.add('open');
}

$('gearBtn').onclick = () => $('settings').classList.toggle('open');

$('saveCfgBtn').onclick = async () => {
  let key = $('apiKey').value.trim();
  if (!key) {
    // 已保存过 key 且本次留空 → 发送哨兵值，后端保留旧 key
    const cfg = await (await fetch('/api/config')).json();
    key = cfg.has_api_key ? '__KEEP__' : '';
    if (!key) { toast('请填写 API Key', false); return; }
  }
  let deeplKey = $('deeplKey').value.trim();
  if (!deeplKey) {
    const cfg = await (await fetch('/api/config')).json();
    deeplKey = cfg.has_deepl_key ? '__KEEP__' : '';
  }
  const res = await fetch('/api/config', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ base_url: $('baseUrl').value, api_key: key, model: $('model').value, deepl_api_key: deeplKey })
  });
  if (res.ok) { toast('设置已保存'); $('settings').classList.remove('open'); await refreshKeyPlaceholder(); }
  else { const e = await res.json(); toast(e.detail || '保存失败', false); }
};

async function refreshKeyPlaceholder() {
  const cfg = await (await fetch('/api/config')).json();
  $('apiKey').value = '';
  $('apiKey').placeholder = cfg.has_api_key ? `已保存 ${cfg.api_key_masked}（留空则不修改）` : 'sk-...';
  $('deeplKey').value = '';
  $('deeplKey').placeholder = cfg.has_deepl_key ? `已保存 ${cfg.deepl_api_key_masked}（留空则不修改）` : '免费版 key 以 :fx 结尾；留空则不翻译';
}

// 测试/取列表用表单当前值（api_key 留空则后端回退已保存 key）
function formProbeBody() {
  return {
    base_url: $('baseUrl').value,
    api_key: $('apiKey').value.trim(),
    model: $('model').value
  };
}

$('testBtn').onclick = async () => {
  $('testBtn').disabled = true; $('testBtn').textContent = '测试中…';
  try {
    const res = await fetch('/api/test', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(formProbeBody())
    });
    const r = await res.json();
    if (r.ok) {
      toast(r.warning ? `⚠ ${r.warning}` : `连接成功（模型 ${r.model}）`, !r.warning);
    } else {
      toast(`连接失败：${r.message || r.detail || '未知错误'}`, false);
    }
  } catch (e) { toast('请求失败：' + e.message, false); }
  $('testBtn').disabled = false; $('testBtn').textContent = '测试连接';
};

$('fetchModelsBtn').onclick = async () => {
  $('fetchModelsBtn').disabled = true;
  try {
    const res = await fetch('/api/models', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(formProbeBody())
    });
    if (!res.ok) { const e = await res.json(); toast(e.detail || '获取失败', false); return; }
    const r = await res.json();
    const dl = $('modelList');
    dl.innerHTML = '';
    r.models.forEach(m => { const o = document.createElement('option'); o.value = m; dl.appendChild(o); });
    toast(`获取到 ${r.models.length} 个模型，输入框可下拉选择`);
  } catch (e) { toast('请求失败：' + e.message, false); }
  $('fetchModelsBtn').disabled = false;
};

/* ---------- 图片上传 ---------- */
let files = [];
function renderThumbs() {
  const box = $('thumbs');
  box.innerHTML = '';
  files.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    const rm = document.createElement('button');
    rm.className = 'rm'; rm.textContent = '✕'; rm.title = '移除';
    rm.onclick = e => { e.stopPropagation(); files.splice(i, 1); renderThumbs(); };
    d.appendChild(img); d.appendChild(rm); box.appendChild(d);
  });
}
function addFiles(list) {
  for (const f of list) {
    if (!f.type.startsWith('image/')) continue;
    if (f.size > 10 * 1024 * 1024) { toast(`${f.name} 超过 10MB，已跳过`, false); continue; }
    if (files.length >= 8) { toast('最多 8 张图片', false); break; }
    files.push(f);
  }
  renderThumbs();
}
const drop = $('drop');
drop.onclick = () => $('fileInput').click();
$('fileInput').onchange = e => addFiles(e.target.files);
['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

/* ---------- 生成 ---------- */
const SEC_DEF = [
  { key: 'item_name', name: '商品名称 Item Name（2026 新规）', counter: t => `${t.length} / 75 字符` },
  { key: 'item_highlights', name: '商品亮点 Item Highlights（2026 新规）', counter: t => `${t.length} / 125 字符` },
  { key: 'bullet_points', name: '五点描述 Bullet Points（FBE 结构）' },
  { key: 'description', name: '产品描述 Description' },
  { key: 'search_terms', name: '搜索词 Search Terms', counter: t => `${new Blob([t]).size} / 250 字节` },
];

function copyText(t, btn) {
  navigator.clipboard.writeText(t).then(
    () => { const old = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(() => btn.textContent = old, 1500); },
    () => toast('复制失败，请手动选择复制', false)
  );
}

function renderSections(sections, raw) {
  const box = $('sections');
  box.innerHTML = '';
  let idx = 0;
  for (const def of SEC_DEF) {
    const text = sections[def.key] !== undefined ? sections[def.key] : null;
    const sec = document.createElement('div');
    sec.className = 'sec';
    const head = document.createElement('div');
    head.className = 'sec-head';
    head.innerHTML = `<span class="sec-title">${def.name}</span>` +
      (def.counter && text ? `<span class="sec-meta">${def.counter(text)}</span>` : '');
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm'; btn.textContent = '复制';
    btn.onclick = () => copyText(text || '', btn);
    head.appendChild(btn);
    const body = document.createElement('div');
    body.className = 'sec-body';
    body.textContent = text !== null ? text : '（本次未生成该部分）';
    const zh = document.createElement('div');
    zh.className = 'sec-zh'; zh.id = `sec-zh-${def.key}`;
    sec.appendChild(head); sec.appendChild(body); sec.appendChild(zh);
    box.appendChild(sec);
    if (text) idx++;
  }
  const missing = SEC_DEF.filter(d => sections[d.key] === undefined).map(d => d.name);
  if (missing.length) toast(`缺少部分：${missing.join('、')}`, false);
  return raw;
}

$('copyAllBtn').onclick = () => {
  const parts = [];
  document.querySelectorAll('.sec').forEach(sec => {
    const name = sec.querySelector('.sec-title').textContent;
    const body = sec.querySelector('.sec-body').textContent;
    parts.push(`【${name}】\n${body}`);
  });
  copyText(parts.join('\n\n'), $('copyAllBtn'));
};

function setStatus(html) { $('status').innerHTML = html; }

$('genBtn').onclick = async () => {
  if (!files.length) { toast('请先上传商品图片', false); return; }
  if (!$('competitor').value.trim()) { toast('请填写竞品五点描述', false); return; }

  const fd = new FormData();
  files.forEach(f => fd.append('images', f, f.name));
  fd.append('competitor_bullets', $('competitor').value);
  fd.append('marketplace', $('marketplace').value);
  fd.append('product_name', $('productName').value);
  fd.append('notes', $('notes').value);

  $('genBtn').disabled = true;
  $('resultCard').style.display = 'block';
  $('sections').innerHTML = '';
  const stream = $('stream');
  stream.style.display = 'block';
  stream.textContent = '';
  stream.scrollTop = stream.scrollHeight;
  setStatus('<span class="dot"></span> 生成中…');
  $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

  try {
    const res = await fetch('/api/generate', { method: 'POST', body: fd });
    if (!res.ok) {
      const e = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }));
      throw new Error(e.detail || `HTTP ${res.status}`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const line = block.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        handleEvent(JSON.parse(line.slice(6)));
      }
    }
  } catch (e) {
    setStatus(`<span class="err">失败：${e.message}</span>`);
    toast('生成失败：' + e.message, false);
  }
  $('genBtn').disabled = false;
};

function handleEvent(ev) {
  if (ev.type === 'delta') {
    const stream = $('stream');
    stream.textContent += ev.text;
    stream.scrollTop = stream.scrollHeight;
  } else if (ev.type === 'done') {
    $('stream').style.display = 'none';
    renderSections(ev.sections, ev.raw);
    if (ev.warning) { setStatus('<span class="err">⚠ ' + ev.warning + '</span>'); toast(ev.warning, false); }
    else setStatus('<span class="ok">✓ 生成完成</span>');
    toast('生成完成');
  } else if (ev.type === 'translated') {
    for (const k in ev.sections) {
      const el = $('sec-zh-' + k);
      if (el) { el.textContent = ev.sections[k]; el.style.display = 'block'; }
    }
    setStatus('<span class="ok">✓ 生成完成（含中文对照）</span>');
  } else if (ev.type === 'translate_error') {
    toast(ev.message, false);
    setStatus('<span class="ok">✓ 生成完成</span><span class="err">（翻译失败）</span>');
  } else if (ev.type === 'error') {
    setStatus(`<span class="err">出错：${ev.message}</span>`);
    toast(ev.message, false);
  }
}

loadConfig();
</script>
</body>
</html>
